<svg
  width="900"
  height="360"
  viewBox="0 0 900 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bodyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1a0a5e" />
      <stop offset="100%" stopColor="#120037" />
    </linearGradient>

    <linearGradient id="topGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#2a1b7a" />
      <stop offset="100%" stopColor="#1a0a5e" />
    </linearGradient>

    <linearGradient id="paperGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#f1f3f8" />
    </linearGradient>

    <!-- Sombra -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" floodOpacity="0.35" />
    </filter>
  </defs>

  <!-- Cuerpo principal -->
  <rect
    x="60"
    y="130"
    width="780"
    height="180"
    rx="36"
    fill="url(#bodyGradient)"
    filter="url(#softShadow)"
  />

  <!-- Parte superior -->
  <rect
    x="120"
    y="80"
    width="660"
    height="90"
    rx="28"
    fill="url(#topGradient)"
  />

  <!-- Ranura de impresión -->
  <rect
    x="230"
    y="145"
    width="440"
    height="18"
    rx="9"
    fill="#0b0024"
  />

  <!-- Papel (placeholder animable) -->
  <rect
    x="260"
    y="20"
    width="380"
    height="120"
    rx="10"
    fill="url(#paperGradient)"
    stroke="#e5e8f0"
    strokeWidth="2"
  />

  <!-- Detalles minimal -->
  <circle cx="700" cy="205" r="6" fill="#6d5cff" />
  <circle cx="720" cy="205" r="6" fill="#3c2ea6" />
  <circle cx="740" cy="205" r="6" fill="#24155f" />
</svg>
